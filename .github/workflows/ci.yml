name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # 缓存 Bun 的全局包缓存而不是 node_modules：装包本身很快，慢的是下载。
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      # hashfiles 的产物在 gitignore 里，而它的单测要 spawn dist/hashFiles.js，
      # 所以这里得先构建。放在 fmt:check 之后：build.ts 产出的 src/index.ts 未经
      # 格式化，提前跑会让 fmt:check 变红。
      - name: Build hashfiles
        run: bun run --cwd packages/hashfiles build

      # runner 自带 Docker，所以需要 daemon 的用例（docker.e2e.test.ts 等）在这里
      # 会真正执行，本地没有 daemon 时它们只是跳过。
      - name: Unit tests
        run: bunx vitest run

      # 两个构建都放进来：它们做的是测试碰不到的模块解析和类型检查，代码能过测试
      # 不代表 bundle 打得出来，也不代表应用编译得过。
      - name: Build CLI bundle
        run: bun run actions:build

      - name: Build app
        run: bun run build
