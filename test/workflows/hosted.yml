name: Hosted Basic
run-name: hosted basic by ${{ github.actor }}

# --hosted 的冒烟 fixture：整条流程只用宿主机，不需要 Docker daemon。
#
# 因此这里不出现 docker:// 动作、job 级 container: 与 services:（这三样在 --hosted 下
# 仍会去叫 Docker）。`actions/checkout@v4` 保留着，但 --hosted 下 skipCheckout 把它换成
# 「把 workdir 拷进沙箱」，仓库里的 ./test/actions 与相对路径才因此可见 —— 这是本文件
# 唯一被复用的宿主侧副作用，见 README 的「Run a job directly on the host」。
#
# 断言一律写成 `... || exit 1`：默认 shell 是 `sh -e`（实际上跑的是 bash），失败的断言
# 会让步骤退出非零，从而把作业判失败。注意失败信号只落在**那个作业**的 `Job failed` 上
# （CLI 的退出码恒为 0），所以跑完要看日志。
#
# failing-composite 与 composite-after-failure 是这里仅有的两个**预期**失败作业——它们的
# 失败正是断言本身，分别由 consume-failing-composite 与 consume-composite-after-failure 检查。
# 其余作业都应当跑成 Job succeeded。
#
# 作业级 `uses:` 调的本地可重用工作流也是同一套宿主侧机制：skipCheckout 默认开着，
# 被调方按仓库根相对路径在进程内读盘，不联网、不起容器，因此这一节同样不需要 Docker。
on: push

env:
  WORKFLOW_ENV: workflow
  SHADOWED: workflow
  # 工作流级 env 的值也是运行期求值，此时 github 上下文已经就绪
  EVENT_FROM_ENV: ${{ github.event_name }}

defaults:
  run:
    shell: bash

jobs:
  contexts:
    name: contexts and expressions
    runs-on: ubuntu-latest
    env:
      JOB_ENV: job
      SHADOWED: job
    steps:
      # 把仓库拷进沙箱，下面的相对路径与 ./test/actions 才有东西可指
      - uses: actions/checkout@v4

      - name: workflow env lands first, job env overrides the same key
        run: |
          [ "$WORKFLOW_ENV" = "workflow" ] || exit 1
          [ "$JOB_ENV" = "job" ] || exit 1
          [ "$SHADOWED" = "job" ] || exit 1
          [ "$EVENT_FROM_ENV" = "push" ] || exit 1
          [ "${{ env.SHADOWED }}" = "job" ] || exit 1

      - name: step env overrides the job env
        env:
          SHADOWED: step
        run: |
          echo "SHADOWED=$SHADOWED"
          [ "$SHADOWED" = "step" ] || exit 1
          [ "${{ env.SHADOWED }}" = "step" ] || exit 1

      - name: checkout brings the repository into the sandbox
        run: |
          [ -f test/workflows/hosted.yml ] || exit 1
          [ -d test/actions ] || exit 1

      # hashFiles 的脚本是容器在 start() 时写进沙箱的：漏了这一步，这个表达式只会静默
      # 返回空串（缓存 key 会因此全部塌成一个），所以断言它既有值、长度也对
      - name: hashFiles resolves on the host too
        run: |
          HASH="${{ hashFiles('package.json') }}"
          echo "hashFiles(package.json)=$HASH"
          [ -n "$HASH" ] || exit 1
          [ "${#HASH}" = "64" ] || exit 1

      - name: github and runner contexts
        run: |
          [ "$GITHUB_EVENT_NAME" = "push" ] || exit 1
          [ "$GITHUB_ACTIONS" = "true" ] || exit 1
          [ "${{ github.event_name }}" = "push" ] || exit 1
          [ -n "${{ github.repository }}" ] || exit 1
          [ -n "${{ github.actor }}" ] || exit 1
          [ -n "${{ runner.os }}" ] || exit 1
          [ "${{ runner.os }}" = "$RUNNER_OS" ] || exit 1
          [ "${{ runner.arch }}" = "$RUNNER_ARCH" ] || exit 1
          echo "ref=${{ github.ref }} sha=${{ github.sha }} workspace=$GITHUB_WORKSPACE"

      - name: expression functions
        run: |
          [ "${{ contains('Hello World', 'WORLD') }}" = "true" ] || exit 1
          [ "${{ contains(fromJSON('["a","b"]'), 'b') }}" = "true" ] || exit 1
          # 数组是精确匹配（不折叠大小写），字符串才折叠
          [ "${{ contains(fromJSON('["a","b"]'), 'B') }}" = "false" ] || exit 1
          [ "${{ startsWith('refs/heads/master', 'REFS/HEADS/') }}" = "true" ] || exit 1
          [ "${{ endsWith('hosted.yml', '.YML') }}" = "true" ] || exit 1
          [ "${{ format('{0}@{1}', 'job', '01') }}" = "job@01" ] || exit 1
          [ "${{ join(fromJSON('["a","b","c"]'), '-') }}" = "a-b-c" ] || exit 1
          [ "${{ fromJSON('1') + fromJSON('41') }}" = "42" ] || exit 1
          [ "${{ 'a' != 'b' && 2 > 1 }}" = "true" ] || exit 1

      - name: toJSON produces JSON text
        run: |
          cat > actual.json <<'EOF'
          ${{ toJSON(fromJSON('{"k":[1,2]}')) }}
          EOF
          cat actual.json
          [ "$(cat actual.json)" = '{"k":[1,2]}' ] || exit 1

      - name: an unset context property renders as an empty string
        run: |
          [ -z "${{ vars.UNSET_VAR }}" ] || exit 1
          [ -z "${{ env.UNSET_ENV }}" ] || exit 1
          [ -z "${{ inputs.unset_input }}" ] || exit 1

  file-commands:
    name: file commands
    runs-on: ubuntu-latest
    outputs:
      from-step: ${{ steps.write.outputs.count }}
      hyphen-named: ${{ steps.write.outputs.answer-42 }}
    steps:
      - uses: actions/checkout@v4

      - name: write env / output / path / summary
        id: write
        run: |
          echo "PLAIN=plain value" >> "$GITHUB_ENV"
          {
            echo 'HEREDOC<<EOF'
            echo 'first line'
            echo 'second line'
            echo 'EOF'
          } >> "$GITHUB_ENV"
          echo "count=2" >> "$GITHUB_OUTPUT"
          # 名字里的连字符是对表达式重写的边界：needs 与 steps 两处都要取到它
          echo "answer-42=yes" >> "$GITHUB_OUTPUT"
          echo "### hosted basic" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .hosted-bin
          printf '#!/bin/sh\necho from-prepended-path\n' > .hosted-bin/prepended.sh
          chmod +x .hosted-bin/prepended.sh
          echo "$PWD/.hosted-bin" >> "$GITHUB_PATH"

      - name: the previous step env is visible next, heredoc keeps its lines
        run: |
          [ "$PLAIN" = "plain value" ] || exit 1
          [ "${{ env.PLAIN }}" = "plain value" ] || exit 1
          [ "$(printf '%s\n' "$HEREDOC" | wc -l | tr -d ' ')" = "2" ] || exit 1
          printf '%s\n' "$HEREDOC" | grep -qx 'second line' || exit 1

      - name: the previous step outputs come back through the steps context
        run: |
          [ "${{ steps.write.outputs.count }}" = "2" ] || exit 1
          [ "${{ steps.write.outputs.answer-42 }}" = "yes" ] || exit 1

      - name: a directory prepended to GITHUB_PATH takes effect next step
        run: prepended.sh | grep -qx 'from-prepended-path' || exit 1

  matrix:
    name: matrix ${{ matrix.os }} node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
        exclude:
          - os: macos-latest
            node: 20
        include:
          - os: ubuntu-latest
            node: 20
            label: added-by-include
    steps:
      - name: only three cells, the excluded combination is not among them
        run: |
          case "${{ matrix.os }}-${{ matrix.node }}" in
            ubuntu-latest-18|ubuntu-latest-20|macos-latest-18) ;;
            *) echo "unexpected cell"; exit 1 ;;
          esac

      - name: a key added by include belongs only to the cell it matched
        run: |
          if [ "${{ matrix.node }}" = "20" ]; then
            [ "${{ matrix.label }}" = "added-by-include" ] || exit 1
          else
            [ -z "${{ matrix.label }}" ] || exit 1
          fi

      - name: strategy context
        run: |
          [ "${{ strategy.job-total }}" = "3" ] || exit 1
          case "${{ strategy.job-index }}" in
            0|1|2) ;;
            *) exit 1 ;;
          esac

  local-actions:
    name: local composite and node actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 复合动作内部又 checkout 一次：--hosted 下仍是「把 workdir 拷进沙箱」，
      # 重复拷同一份内容不该出错
      - name: local composite action
        id: composite
        uses: ./test/actions/hello-world-composite-action
        with:
          who-to-greet: hosted

      - name: the composite output bubbles up to the steps context
        run: |
          [ -n "${{ steps.composite.outputs.random-number }}" ] || exit 1
          case "${{ steps.composite.outputs.random-number }}" in
            ''|*[!0-9]*) exit 1 ;;
          esac

      # node20 动作走宿主机上的 node（--hosted 直接 spawn，不经过容器）
      - name: local node20 action
        id: node
        uses: ./test/actions/hello-world-javascript-action
        with:
          who-to-greet: hosted

      - name: the node action output
        run: |
          [ -n "${{ steps.node.outputs.time }}" ] || exit 1
          echo "time=${{ steps.node.outputs.time }}"

  # 复合动作上的 env 作用域与嵌套复合动作：action1 的每一步都是 `exit 1` 配
  # `if: env.X != '<期望值>'`，env 传对了整步跳过，传错就会执行 exit 1 把作业判失败。
  # 它的最后一步再嵌一个 action2，覆盖嵌套那一层的 env 覆盖（action2 里 COMPOSITE_OVERRIDE 换成 2）。
  composite-env:
    name: composite env scoping and a nested composite
    runs-on: ubuntu-latest
    env:
      JOB: '1'
      GLOBAL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: env scoping inside the composite
        uses: ./test/actions/composite-env/action1
        env:
          COMPOSITE_OVERRIDE: '1'

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      # set_env 的 block list：写进去的命令会被拦下并留下一条注解，但值不生效，
      # 步骤本身也不失败
      - name: writing NODE_OPTIONS is blocked by set_env
        run: |
          echo "NODE_OPTIONS=--max-old-space-size=1" >> "$GITHUB_ENV"
          [ "${NODE_OPTIONS:-}" != "--max-old-space-size=1" ] || exit 1

      # ::error:: 只收进注解，不改变步骤结论；真失败还是要靠退出码
      - name: '::error:: and ::warning:: do not change the step conclusion'
        run: |
          echo "::error::hosted basic emits this one on purpose ::error::"
          echo "::warning::hosted basic emits this one on purpose ::warning::"
          echo "reached the next line after ::error::"

      - name: 'the rest of the line after ::add-mask:: gets masked'
        run: printf '::add-mask::%s\n' "hosted-secret-value"

      - name: fails but is tolerated by continue-on-error
        id: tolerated
        continue-on-error: true
        run: exit 1

      - name: a tolerated step has outcome failure and conclusion success
        run: |
          [ "${{ steps.tolerated.outcome }}" = "failure" ] || exit 1
          [ "${{ steps.tolerated.conclusion }}" = "success" ] || exit 1

      # 下面两步的条件都为假，真跑了就 exit 1，断言就是靠这个生效的
      - name: skipped when the condition is false
        if: ${{ 1 == 2 }}
        run: exit 1

      - name: cancelled() is false in a run that finished normally
        if: cancelled()
        run: exit 1

  # 可重用工作流：断言都写在被调方里，这里只负责用各种调用形态把它们拉起来
  reusable-inputs:
    name: reusable workflow with inputs and an explicit secrets map
    # with-inputs.yml 自己断言了三种类型的必填输入、三个被默认值补上的可选项、
    # 显式传进来的 secret，以及 github.event_name 不是 workflow_call
    uses: ./test/workflows/workflow_call/with-inputs.yml
    with:
      string_required: string
      bool_required: ${{ true }}
      number_required: 1
    secrets:
      secret: keep_it_private

  reusable-on-string:
    name: reusable workflow declared with a string on
    uses: ./test/workflows/workflow_call/no-inputs-string.yml

  reusable-on-array:
    name: reusable workflow declared with an array on
    uses: ./test/workflows/workflow_call/no-inputs-array.yml

  reusable-matrix:
    name: reusable matrix ${{ matrix.who }}
    strategy:
      matrix:
        who: [alpha, beta]
    # 每个格子各调一次，with 在 caller 的 matrix 上下文里求值
    uses: ./test/workflows/workflow_call/matrix-cell.yml
    with:
      who: ${{ matrix.who }}

  reusable-nested:
    name: reusable workflow calling another reusable workflow
    # 两级嵌套 hosted → nested.yml → outputs.yml，中间层的断言在 nested.yml 里
    uses: ./test/workflows/workflow_call/nested.yml

  consume-reusable:
    name: consume reusable outputs
    needs: [reusable-inputs, reusable-on-string, reusable-on-array, reusable-matrix, reusable-nested]
    runs-on: ubuntu-latest
    steps:
      - name: the callee workflow outputs come back to the caller job, every job succeeded
        run: |
          [ "${{ needs.reusable-inputs.outputs.output }}" = "string" ] || exit 1
          [ "${{ needs.reusable-inputs.result }}" = "success" ] || exit 1
          [ "${{ needs.reusable-on-string.result }}" = "success" ] || exit 1
          [ "${{ needs.reusable-on-array.result }}" = "success" ] || exit 1
          [ "${{ needs.reusable-matrix.result }}" = "success" ] || exit 1
          [ "${{ needs.reusable-nested.result }}" = "success" ] || exit 1

  # 本文件预期失败的作业之一：它的失败正是断言本身，由 consume-failing-composite 检查。
  # 同样的场景在 test/workflows/uses-composite/with-error.yml 里可以单独手工跑。
  failing-composite:
    name: a failing composite action fails its job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composite-with-error 的第一步 exit 1。内嵌步骤的失败被它自己的 runtime 消化掉，
      # 不会作为异常冒到这一步，所以这一步的结论只能靠复合动作自己的结果折算出来。
      - name: a composite action that fails inside
        uses: ./test/actions/composite-with-error

      # 作业此刻已经失败：failure() 的这一步该跑到。它跑不到的话，下面那条断言读到的
      # needs.result 就会是 success，把 consume-failing-composite 判失败。
      - name: after the composite failed
        if: failure()
        run: echo "the composite failure is already part of the job status"

  consume-failing-composite:
    name: consume the failing composite result
    needs: [failing-composite]
    # 上游失败了，只有 always() 才跑得到这一步
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: the failure inside the composite fails the whole job
        run: |
          [ "${{ needs.failing-composite.result }}" = "failure" ] || exit 1

  # 作业在复合动作之前就已经失败。复合动作的步骤仍应照跑，它内部的 success()/failure()
  # 读的也该是复合动作自己的 action_status 而不是作业状态 —— 这一条只有在作业先红了的时候
  # 才有判定力：作业还好时两条路径给出的答案一样，断言就白写了。
  # 同样的道理，作业本身就是预期失败的，断言只能交给下游的 consume 作业。
  composite-after-failure:
    name: a composite still runs its steps after the job failed
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.composite.outcome }}
      ran-after-failure: ${{ steps.composite.outputs.ran-after-failure }}
      ran-unguarded: ${{ steps.composite.outputs.ran-unguarded }}
    steps:
      - uses: actions/checkout@v4

      - name: fail the job first
        run: exit 1

      # 少了 if: always() 这一步会被默认的 success() 跳过——那正是改动前的行为
      - name: a composite that must still run after the job failed
        id: composite
        if: always()
        uses: ./test/actions/composite-with-error

  consume-composite-after-failure:
    name: consume the composite that ran after the job failed
    needs: [composite-after-failure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: the job failure did not stop the composite, and its conditions read its own status
        run: |
          [ "${{ needs.composite-after-failure.result }}" = "failure" ] || exit 1
          [ "${{ needs.composite-after-failure.outputs.outcome }}" = "failure" ] || exit 1
          [ "${{ needs.composite-after-failure.outputs.ran-after-failure }}" = "yes" ] || exit 1
          [ -z "${{ needs.composite-after-failure.outputs.ran-unguarded }}" ] || exit 1

  consume:
    name: consume outputs
    needs: [file-commands, local-actions]
    runs-on: ubuntu-latest
    steps:
      - name: needs result and outputs (both the job id and the output name are hyphenated)
        run: |
          [ "${{ needs.file-commands.result }}" = "success" ] || exit 1
          [ "${{ needs.local-actions.result }}" = "success" ] || exit 1
          [ "${{ needs.file-commands.outputs.from-step }}" = "2" ] || exit 1
          [ "${{ needs.file-commands.outputs.hyphen-named }}" = "yes" ] || exit 1
