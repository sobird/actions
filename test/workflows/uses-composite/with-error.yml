name: uses-composite-with-error

# 手工复现用：hosted.yml 里有一条等价的作业（failing-composite），跑 actions:test 就能覆盖。
on: push

jobs:
  failing-composite-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composite-with-error 的第一步 exit 1。内嵌步骤的失败被它自己的 runtime 消化掉，
      # 不会作为异常冒到这一步，所以这一步的结论只能靠复合动作自己的结果折算出来。
      - name: 内部失败的复合动作
        uses: ./test/actions/composite-with-error

      # 作业此刻已经失败：failure() 的那一步该跑到，success() 的那一步该被跳过。
      # 「该跳过」只有日志能看——作业早就红了，它多跑一步也翻不出新的失败信号。
      - name: 复合动作失败之后
        if: failure()
        run: echo "复合动作的失败已经算进作业状态"
      - name: 复合动作成功之后
        if: success()
        run: echo "这一行不该出现在日志里"
