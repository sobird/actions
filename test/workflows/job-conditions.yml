name: Job Conditionals
run-name: job conditionals by ${{ github.actor }}

on:
  push:

jobs:
  # 成功的作业，给 needs 提供 success 输入。
  passes:
    runs-on: ubuntu-latest
    steps:
      - name: succeed on purpose
        run: echo "passes"

  # 故意失败的作业，给下游的 needs.<job>.result 提供输入。
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: fail on purpose
        run: exit 1

  # 不写 if 时作业条件是默认值 success()（见 Job 构造里 Expression 的 defaultValue），
  # 依赖的作业成功则运行。
  runs-on-implicit-success:
    needs: [passes]
    runs-on: ubuntu-latest
    steps:
      - name: runs because passes succeeded
        run: |
          echo "needs.passes.result=${{ needs.passes.result }}"
          [ "${{ needs.passes.result }}" = "success" ] || exit 1

  # 同一个默认值在依赖作业失败时必须为 false，这个作业应被跳过。
  skipped-by-implicit-success:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      # setup 已经失败，这个作业本就不该运行；真的跑了就 exit 1。
      - name: must never run
        run: exit 1

  runs-on-failure:
    needs: [setup]
    if: ${{ needs.setup.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: runs because needs.setup.result is failure
        run: |
          echo "needs.setup.result=${{ needs.setup.result }}"
          [ "${{ needs.setup.result }}" = "failure" ] || exit 1

  runs-on-always:
    needs: [setup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: runs because always() is true
        run: echo "always() evaluated to true"

  skipped-on-success:
    needs: [setup]
    if: ${{ needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # setup 已经失败，这个作业本就不该运行；真的跑了就 exit 1。
      - name: must never run
        run: exit 1
