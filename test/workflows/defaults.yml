name: Defaults
run-name: defaults by ${{ github.actor }}

on:
  push:

defaults:
  run:
    shell: bash
    working-directory: test/workflows

jobs:
  workflow-defaults:
    runs-on: ubuntu-latest
    steps:
      - name: inherits the workflow defaults
        run: |
          echo "pwd=$(pwd)"
          printf '%s' "$(pwd)" | grep -q '/test/workflows$' || exit 1

  job-defaults:
    runs-on: ubuntu-latest
    # defaults.run 是按 key 逐项合并的（job 优先），所以这里只覆盖
    # working-directory，shell 仍来自 workflow 级。
    defaults:
      run:
        working-directory: test/actions
    steps:
      - name: inherits the job defaults
        run: |
          echo "pwd=$(pwd)"
          printf '%s' "$(pwd)" | grep -q '/test/actions$' || exit 1

  # 只覆盖 shell、让 working-directory 走继承 —— 这是「按 key 合并」与
  # 「整块覆盖」的分界点：整块覆盖的实现下这个 job 会落在仓库根目录。
  job-overrides-shell-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: inherits the workflow working-directory
        run: |
          echo "pwd=$(pwd)"
          printf '%s' "$(pwd)" | grep -q '/test/workflows$' || exit 1

  step-overrides:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/actions
    steps:
      - name: step working-directory overrides the job default
        working-directory: test/workflows
        run: |
          echo "pwd=$(pwd)"
          printf '%s' "$(pwd)" | grep -q '/test/workflows$' || exit 1

      - name: step shell overrides the job default
        shell: sh
        run: echo "explicit sh shell works"
