on:
  push:
    branches:
      - main
      - 'mona/octocat'
      - 'releases/**'
    tags:
      - v2
      - v1.*
  schedule:
    - cron: '30 5 * * 1,3'
    - cron: '30 5 * * 2,4'

jobs:
  test_schedule:
    runs-on: ubuntu-latest
    steps:
      # 注意：runner 只按事件名匹配 on:，不会解析 cron，也不会填充
      # github.event.schedule。所以这个条件恒为 true，本步骤总会执行；
      # 这里保留原样是为了对齐上游 workflow 的形状，不是在测 schedule 过滤。
      - name: Not on Monday or Wednesday
        if: github.event.schedule != '30 5 * * 1,3'
        run: echo "This step will be skipped on Monday and Wednesday"
      - name: Every time
        run: echo "This step will always run"
