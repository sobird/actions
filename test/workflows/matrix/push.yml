name: matrix
on: push

jobs:
  build:
    name: Node ${{ matrix.os }} ${{ matrix.node}}
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo ${NODE_VERSION} | grep ${{ matrix.node }}
        env:
          NODE_VERSION: ${{ matrix.node }}
    strategy:
      matrix:
        # 只保留 ubuntu：默认 labels 里没有 windows/macos，Labels.pickPlatform
        # 对未知 label 会回退到 gitea/runner-images:ubuntu-latest，
        # 列上它们只是看起来跨平台，实际全跑在 ubuntu 镜像上。
        os: [ubuntu-latest]
        node: [6, 8, 10]

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [8.x, 10.x, 12.x, 13.x]
    steps:
      - run: echo ${NODE_VERSION} | grep ${{ matrix.node }}
        env:
          NODE_VERSION: ${{ matrix.node }}
